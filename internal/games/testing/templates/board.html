{{/* The Testing board tenant fragment. The shell links game.css. */}}
{{template "board-frame" .}}

{{define "board-frame"}}
<div
  id="testing-board"
  class="testing-board{{if .Paused}} is-paused{{end}}"
  hx-get="/play/partials/board"
  hx-trigger="sse:pause"
  hx-swap="outerHTML"
>
  <h1>Testing</h1>
  {{template "board-list" .}}
  {{if .ShowEnd}}
  <form class="testing-end" hx-post="/play/end" hx-swap="none">
    <button class="ui-btn ui-btn-danger" type="submit">End game</button>
  </form>
  {{end}}
  {{if .Paused}}<p class="testing-paused">Paused</p>{{end}}
</div>
{{end}}
