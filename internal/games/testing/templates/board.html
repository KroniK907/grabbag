{{template "ui-start" .}}
{{template "round-swap" "/board"}}
<link rel="stylesheet" href="{{.GameCSS}}">
<div class="testing-board{{if .Paused}} is-paused{{end}}">
  <h1>Testing</h1>
  {{template "board-list" .}}
  {{if .ShowEnd}}
  <form method="post" action="/play/end">
    <input type="hidden" name="return" value="/board">
    <button class="ui-btn ui-btn-danger testing-end" type="submit">End game</button>
  </form>
  {{end}}
  {{if .Paused}}<p class="testing-paused">Paused</p>{{end}}
</div>
{{template "ui-end"}}
