<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{.Title}} · GrabBag.gg UI preview</title>
<style>
  body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: #eceef3; color: #1b1b24; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .grid { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: #6a6f80; margin-bottom: 4px; }
  .clip { overflow: hidden; background: #11121a; border-radius: 10px; }
  iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }
</style>
</head>
<body>
<h1>{{.Title}} · {{if .Players}}{{.Players}} seated · {{end}}{{.Theme}}</h1>
<div class="grid">
{{range .Frames}}
  <figure>
    <figcaption><a href="{{.Src}}" target="_blank">{{.Label}}</a></figcaption>
    <div class="clip" style="width: {{.ClipWidth}}px; height: {{.ClipHeight}}px">
      <iframe src="{{.Src}}" style="width: {{.Width}}px; height: {{.Height}}px; transform: scale({{.Zoom}})" title="{{.Label}}"></iframe>
    </div>
  </figure>
{{end}}
</div>
</body>
</html>
