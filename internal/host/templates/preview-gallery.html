<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrabBag.gg UI preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; display: grid; grid-template-columns: 300px 1fr; height: 100vh; color: #1b1b24; background: #eceef3; }
  nav { overflow: auto; background: #fff; border-right: 1px solid #d4d7e0; padding: 8px 10px 40px; }
  nav h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 4px; color: #6a6f80; }
  nav h3 { font-size: 12px; margin: 10px 0 2px; color: #3b3f4d; }
  nav button { display: flex; justify-content: space-between; gap: 6px; width: 100%; border: 0; background: none; text-align: left; padding: 3px 6px; border-radius: 4px; cursor: pointer; font: inherit; }
  nav button:hover { background: #eef0f6; }
  nav button.on { background: #1b1b24; color: #fff; }
  nav small { color: #8a8fa0; }
  nav button.on small { color: #c8cbd6; }
  #bench-link { display: block; margin: 2px 0 6px; padding: 5px 8px; border: 1px solid #c9ccd6; border-radius: 4px; color: inherit; text-decoration: none; text-align: center; }
  #bench-link[hidden] { display: none; }
  #filter, #game { width: 100%; padding: 6px 8px; margin-top: 4px; border: 1px solid #c9ccd6; border-radius: 4px; font: inherit; background: #fff; }
  main { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; padding: 10px 14px; background: #fff; border-bottom: 1px solid #d4d7e0; }
  .bar label { display: grid; gap: 2px; font-size: 11px; color: #6a6f80; text-transform: uppercase; letter-spacing: .04em; }
  .bar select, .bar input { font: inherit; padding: 4px 6px; border: 1px solid #c9ccd6; border-radius: 4px; min-width: 90px; text-transform: none; }
  .bar textarea { font: 12px/1.3 ui-monospace, monospace; width: 340px; height: 54px; border: 1px solid #c9ccd6; border-radius: 4px; }
  .bar a { font-size: 13px; }
  .stage { overflow: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
  .device { background: #11121a; padding: 10px; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .device iframe { border: 0; background: #fff; display: block; transform-origin: 0 0; }
  .meta { font-size: 12px; color: #6a6f80; }
  .err { color: #b3261e; }
</style>
</head>
<body>
<nav>
  <a id="bench-link" href="/dev/bench/" hidden>Test bench</a>
  <input id="filter" type="search" placeholder="Filter scenarios">
  <select id="game" aria-label="Game"><option value="">All games</option></select>
  <div id="list"></div>
</nav>
<main>
  <div class="bar">
    <label>Theme <select id="theme"></select></label>
    <label>Seated <select id="players"></select></label>
    <label>Viewport <select id="device"></select></label>
    <label>Orientation <select id="orient"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></label>
    <label>Text size <select id="text"></select></label>
    <label>Fit <select id="fit"><option value="1">Fit to window</option><option value="0">Actual size</option></select></label>
    <label>Open ids <input id="open" placeholder="host-drawer"></label>
    <label>JSON merge patch <textarea id="patch" placeholder='{"Paused": true}'></textarea></label>
    <span id="links"></span>
    <span id="meta" class="meta"></span>
  </div>
  <div class="stage" id="stage"><div class="device" id="device-frame"><iframe id="frame" title="Scenario"></iframe></div></div>
</main>
<script>
(function () {
  "use strict";
  var index, current;
  var $ = function (id) { return document.getElementById(id); };
  // The bench exists only under -dev-bench, so show its link only when it answers.
  fetch("/dev/bench/", { method: "HEAD" }).then(function (r) { $("bench-link").hidden = !r.ok; }).catch(function () {});
  var controls = ["theme", "players", "device", "orient", "text", "fit", "open", "patch"];

  function option(sel, value, label) {
    var o = document.createElement("option");
    o.value = value; o.textContent = label; sel.appendChild(o);
  }

  function keyOf(s) { return s.package + "/" + s.surface + "/" + s.name; }

  function readHash() {
    var h = decodeURIComponent(location.hash.slice(1));
    var q = h.indexOf("?");
    var params = new URLSearchParams(q >= 0 ? h.slice(q + 1) : "");
    return { key: q >= 0 ? h.slice(0, q) : h, params: params };
  }

  function writeHash() {
    if (!current) return;
    var p = new URLSearchParams();
    controls.forEach(function (id) { if ($(id).value) p.set(id, $(id).value); });
    if ($("game").value) p.set("game", $("game").value);
    history.replaceState(null, "", "#" + keyOf(current) + "?" + p.toString());
  }

  function gameLabel(id) {
    if (id === "testing") return "Test";
    return id.charAt(0).toUpperCase() + id.slice(1);
  }

  function fillGames() {
    var sel = $("game"), seen = {};
    index.scenarios.forEach(function (s) {
      if (seen[s.package]) return;
      seen[s.package] = true;
      option(sel, s.package, gameLabel(s.package));
    });
  }

  function buildList() {
    var list = $("list"), filter = $("filter").value.toLowerCase(), game = $("game").value;
    list.innerHTML = "";
    var lastPkg, lastSurface;
    index.scenarios.forEach(function (s) {
      if (game && s.package !== game) return;
      if (filter && keyOf(s).toLowerCase().indexOf(filter) < 0 && s.viewer.indexOf(filter) < 0) return;
      if (s.package !== lastPkg) {
        var h = document.createElement("h2"); h.textContent = s.package; list.appendChild(h);
        lastPkg = s.package; lastSurface = null;
      }
      if (s.surface !== lastSurface) {
        var h3 = document.createElement("h3"); h3.textContent = s.surface; list.appendChild(h3);
        lastSurface = s.surface;
      }
      var b = document.createElement("button");
      b.innerHTML = "<span></span><small></small>";
      b.firstChild.textContent = s.name + (s.sample ? " ★" : "");
      b.lastChild.textContent = s.viewer;
      if (current && keyOf(current) === keyOf(s)) b.className = "on";
      b.onclick = function () { select(s, true); };
      list.appendChild(b);
    });
  }

  function fillPlayers(s, want) {
    var sel = $("players");
    sel.innerHTML = "";
    if (!s.players) { option(sel, "", "n/a"); sel.disabled = true; return; }
    sel.disabled = false;
    s.players.forEach(function (n) {
      var tag = n === s.defaultPlayers ? " (default)" : n === s.realisticPlayers ? " (realistic max)" : n >= 64 ? " (stress)" : n === s.players[0] ? " (min)" : "";
      option(sel, String(n), n + tag);
    });
    if (s.players.indexOf(s.defaultPlayers) < 0) option(sel, String(s.defaultPlayers), s.defaultPlayers + " (default)");
    sel.value = want && [].some.call(sel.options, function (o) { return o.value === want; }) ? want : String(s.defaultPlayers);
  }

  function select(s, resetViewport) {
    current = s;
    var want = $("players").value;
    fillPlayers(s, want);
    if (resetViewport) $("device").value = "frame:" + s.frame;
    buildList();
    render();
  }

  function viewport() {
    var v = $("device").value, d;
    if (v.indexOf("frame:") === 0) d = index.frames[v.slice(6)];
    else d = index.devices.filter(function (x) { return x.id === v; })[0];
    d = d || index.frames.phone;
    var w = d.width, h = d.height;
    if ($("orient").value === "landscape") { w = d.height; h = d.width; }
    return { w: w, h: h, label: d.label };
  }

  function src() {
    var p = new URLSearchParams();
    p.set("theme", $("theme").value);
    if ($("players").value) p.set("players", $("players").value);
    if ($("open").value.trim()) p.set("open", $("open").value.trim());
    var patch = $("patch").value.trim();
    if (patch) p.set("patch", patch);
    return current.path + "?" + p.toString();
  }

  function render() {
    if (!current) return;
    var patch = $("patch").value.trim();
    $("meta").className = "meta";
    if (patch) {
      try { JSON.parse(patch); } catch (e) { $("meta").textContent = "Patch is not JSON: " + e.message; $("meta").className = "meta err"; return; }
    }
    var vp = viewport(), frame = $("frame"), stage = $("stage");
    var scale = 1;
    if ($("fit").value === "1") {
      scale = Math.min(1, (stage.clientWidth - 60) / vp.w, (stage.clientHeight - 60) / vp.h);
    }
    frame.style.width = vp.w + "px";
    frame.style.height = vp.h + "px";
    frame.style.transform = "scale(" + scale + ")";
    $("device-frame").style.width = (vp.w * scale + 20) + "px";
    $("device-frame").style.height = (vp.h * scale + 20) + "px";
    var url = src();
    if (frame.getAttribute("src") !== url) frame.setAttribute("src", url);
    else applyText();
    var links = '<a target="_blank" href="' + url + '">Open page</a>';
    if (current.group) {
      links += ' · <a target="_blank" href="/dev/ui/table/' + current.package + "/" + current.group + "?theme=" + $("theme").value + "&players=" + ($("players").value || "") + '">Table view</a>';
    }
    $("links").innerHTML = links;
    $("meta").textContent = vp.label + " " + vp.w + "×" + vp.h + " · " + Math.round(scale * 100) + "%";
    writeHash();
  }

  function applyText() {
    try {
      var doc = $("frame").contentDocument;
      var s = Number($("text").value) || 1;
      doc.documentElement.style.fontSize = s === 1 ? "" : (16 * s) + "px";
    } catch (e) {}
  }

  $("frame").addEventListener("load", applyText);

  fetch("/dev/ui/index.json").then(function (r) { return r.json(); }).then(function (data) {
    index = data;
    data.themes.forEach(function (t) { option($("theme"), t, t); });
    Object.keys(data.frames).forEach(function (k) { option($("device"), "frame:" + k, "Reference " + data.frames[k].label); });
    data.devices.forEach(function (d) { option($("device"), d.id, d.label + " " + d.width + "×" + d.height); });
    data.textScales.forEach(function (s) { option($("text"), String(s), Math.round(s * 100) + "%"); });
    fillGames();
    var h = readHash();
    if (h.params.has("game")) $("game").value = h.params.get("game");
    controls.forEach(function (id) { if (h.params.has(id) && id !== "players") $(id).value = h.params.get(id); });
    var found = data.scenarios.filter(function (s) { return keyOf(s) === h.key; })[0] || data.scenarios[0];
    current = found;
    fillPlayers(found, h.params.get("players"));
    if (!h.params.has("device")) $("device").value = "frame:" + found.frame;
    buildList();
    render();
  });

  controls.forEach(function (id) { $(id).addEventListener("change", render); });
  $("filter").addEventListener("input", buildList);
  $("game").addEventListener("change", function () { buildList(); writeHash(); });
  window.addEventListener("resize", render);
})();
</script>
</body>
</html>
