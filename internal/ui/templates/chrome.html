{{define "ui-start"}}
<!doctype html>
<html lang="en" data-theme="{{.Theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{static "live.css"}}">
  <script defer src="{{static "htmx.min.js"}}"></script>
  <script defer src="{{static "sse.min.js"}}"></script>
</head>
<body
  class="ui-app"
  hx-ext="sse"
  sse-connect="/lobby/events"
  hx-on::sse-error="document.getElementById('connection-overlay').hidden = false"
  hx-on::sse-open="document.getElementById('connection-overlay').hidden = true"
>
{{template "ui-overlay"}}
{{template "theme-sync" .}}
{{end}}

{{define "ui-start-quiet"}}
<!doctype html>
<html lang="en" data-theme="{{.Theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{static "live.css"}}">
</head>
<body class="ui-app">
{{end}}

{{define "ui-end"}}
</body>
</html>
{{end}}

{{define "ui-overlay"}}
<div id="connection-overlay" class="connection-overlay" role="status" hidden>
  <div class="ui-card">
    <div class="ui-spin" aria-hidden="true"></div>
    <h2>Lost the host</h2>
    <p>Waiting to hear from the machine on the table.</p>
  </div>
</div>
{{end}}

{{define "theme-sync"}}
<div
  id="theme-sync"
  data-theme="{{.Theme}}"
  hx-get="/lobby/partials/theme"
  hx-trigger="sse:theme, htmx:sseOpen from:body"
  hx-swap="outerHTML"
  hx-on::after-swap="document.documentElement.setAttribute('data-theme', event.detail.elt.getAttribute('data-theme'))"
></div>
{{end}}
