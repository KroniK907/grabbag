{{define "room-body"}}
<div
  id="phone-body"
  class="ui-phone-wrap"
  hx-get="/lobby/partials/phone"
  hx-trigger="sse:roster, htmx:sseOpen from:body"
  hx-swap="outerHTML"
>
  <div class="ui-phone">
    <div class="ui-notch">hackbox</div>
    <div class="ui-phone-body">
      <div class="ui-you">{{.DisplayName}}</div>
      <div class="ui-avatar-lg">{{avatar .AvatarSeed}}</div>
      {{if .Seated}}
      <p class="ui-muted">You have a seat. Smash Ready.</p>
      <button class="ui-plunger" type="button">READY</button>
      {{else if .Waiting}}
      <p class="ui-muted">You are in line.</p>
      <form method="post" action="/lobby/wait">
        <button class="ui-btn" type="submit">Leave wait list</button>
      </form>
      {{else}}
      <p class="ui-muted">You are watching. Join the wait line to take a seat.</p>
      <form method="post" action="/lobby/wait">
        <button class="ui-btn" type="submit">Join wait list</button>
      </form>
      {{end}}
      <form method="post" action="/lobby/leave">
        <button class="ui-btn ui-btn-danger" type="submit">Leave</button>
      </form>
    </div>
  </div>
</div>
{{end}}
