{{template "ui-start" .}}
<div class="ui-page">
  <div class="ui-stack">
    <div class="ui-header">
      <div class="ui-brand ui-brand-sm">ROOM KNOBS</div>
      {{template "theme-toggle" .}}
    </div>
    <p class="ui-muted">Room is {{if .Open}}open{{else}}closed{{end}}.</p>
    <form method="post" action="/settings/open">
      <button class="ui-btn" type="submit">Open</button>
    </form>
    <form method="post" action="/settings/close">
      <button class="ui-btn" type="submit">Close</button>
    </form>
    <h2>Players</h2>
    <div class="ui-list">
      {{range .Players}}
      <form class="ui-row" method="post" action="/settings/kick">
        <span>{{.DisplayName}}</span>
        <input type="hidden" name="player_id" value="{{.ID}}">
        <button class="ui-btn ui-btn-danger ui-btn-inline" type="submit">Kick</button>
      </form>
      {{else}}
      <p class="ui-muted">No players yet.</p>
      {{end}}
    </div>
  </div>
</div>
{{template "ui-end"}}

{{define "theme-toggle"}}
<form
  id="theme-toggle"
  method="post"
  action="/settings/theme"
  data-theme="{{.Theme}}"
  hx-post="/settings/theme"
  hx-target="#theme-toggle"
  hx-swap="outerHTML"
  hx-on::after-swap="document.documentElement.setAttribute('data-theme', event.detail.elt.getAttribute('data-theme'))"
>
  {{if eq .Theme "neon-dark"}}
  <button class="ui-btn ui-btn-inline" type="submit">Light</button>
  {{else}}
  <button class="ui-btn ui-btn-inline" type="submit">Dark</button>
  {{end}}
</form>
{{end}}
