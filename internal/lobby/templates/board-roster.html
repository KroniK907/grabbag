{{define "board-roster"}}
<section
  id="board-roster"
  hx-get="/lobby/partials/board-roster"
  hx-trigger="sse:roster, htmx:sseOpen from:body"
  hx-swap="outerHTML"
>
  <h2>Seated</h2>
  <ul>
    {{range .Seated}}<li>{{.DisplayName}}</li>{{else}}<li>No seated players.</li>{{end}}
  </ul>
  <h2>Waiting</h2>
  <ul>
    {{range .Waiting}}<li>{{.DisplayName}}</li>{{else}}<li>No one waiting.</li>{{end}}
  </ul>
</section>
{{end}}
