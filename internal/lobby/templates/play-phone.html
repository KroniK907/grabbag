{{template "ui-start" .}}
{{template "round-swap" "/"}}
<div
  hidden
  hx-get="/lobby/presence"
  hx-trigger="sse:roster"
  hx-swap="none"
  hx-on::response-error="if (event.detail.xhr.status === 410) location.reload()"
></div>
<div class="ui-phone-wrap">
  <div class="ui-phone">
    <div class="ui-notch">grab bag</div>
    <div class="ui-phone-body">
      <div class="ui-phone-stack">
        {{.GameBody}}
      </div>
      <form method="post" action="/lobby/leave">
        <button class="ui-btn ui-btn-danger" type="submit">Leave</button>
      </form>
    </div>
    {{if .HostPanel}}
    <button
      type="button"
      class="ui-btn ui-drawer-handle"
      aria-controls="host-drawer"
      onclick="document.getElementById('host-drawer').classList.add('is-open')"
    >Host</button>
    {{template "host-drawer" .}}
    {{end}}
  </div>
</div>
{{template "ui-end"}}
